<header><h1>Che, escuchá</h1>

 <div class="ctl">

</div>

  d.querySelector('.a').textContent=r.es;d.querySelector('.b').textContent=r.en;
  if(r.t)d.querySelector('.c').textContent='» '+r.t;
  d.onclick=()=>{S.i=r.i;stop();start();};L.appendChild(d);});}
function paint(){const r=rows[S.i];if(!r)return;
 $('idx').textContent='#'+r.n+'  ·  '+r.s;$('cEs').textContent=r.es;
 $('cEn').textContent=$('hide').checked?'':r.en;
 if(r.t){$('cNt').textContent='» '+r.t;$('cNt').hidden=$('hide').checked;}else $('cNt').hidden=true;
 document.querySelectorAll('.item').forEach(e=>e.classList.toggle('cur',+e.dataset.i===S.i));
 const c=document.querySelector('.item.cur');if(c&&S.playing)c.scrollIntoView({block:'center',behavior:'smooth'});
 save();}

function playMp3(r){return new Promise(res=>{
 au.src=src(r);au.playbackRate=parseFloat($('rate').value);
 au.onended=()=>res(true);au.onerror=()=>res(false);
 au.play().catch(()=>res(false));});}
function speak(t,lang){return new Promise(res=>{
 const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=parseFloat($('rate').value);
 const vs=(synth.getVoices()||[]).filter(v=>(v.lang||'').toLowerCase().startsWith(lang.slice(0,2)));
 const ar=vs.find(v=>(v.lang||'').toLowerCase().replace('_','-')==='es-ar');
 if(lang.startsWith('es')&&(ar||vs[0]))u.voice=ar||vs[0];
 u.onend=res;u.onerror=res;synth.speak(u);});}
async function sayEs(r){ if(await playMp3(r))return; await speak(r.es,'es-AR'); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function one(i){const r=rows[i];if(!r)return;
 const m=$('mode').value,reps=+$('reps').value,gap=+$('gap').value;
 if(m==='enes'){await speak(r.en,'en-US');if(!S.playing)return;await wait(gap);}
 for(let k=0;k<reps;k++){if(!S.playing)return;await sayEs(r);
  if(!S.playing)return;if(k<reps-1)await wait(gap);}
 if(m==='esen'){if(!S.playing)return;await wait(gap);await speak(r.en,'en-US');}}
let chain=null;
async function start(){S.playing=true;$('play').textContent='❚❚ Pausar';$('play').classList.add('on');
 const id=chain={};
 while(S.playing&&chain===id){paint();await one(S.i);
  if(!S.playing||chain!==id)return;await wait(+$('gap').value);
  if(!S.playing||chain!==id)return;
  const L=S.filtered.length?S.filtered:rows,p=L.findIndex(r=>r.i===S.i);
  if(p<0||p>=L.length-1){stop();return;} S.i=L[p+1].i;}}
function stop(){S.playing=false;chain=null;synth.cancel();au.pause();
 $('play').textContent='▶ Reproducir';$('play').classList.remove('on');}
function step(d){const L=S.filtered.length?S.filtered:rows;let p=L.findIndex(r=>r.i===S.i);
 if(p<0)p=0;p=Math.max(0,Math.min(L.length-1,p+d));S.i=L[p].i;
 const w=S.playing;stop();paint();if(w)start();}

$('play').onclick=()=>S.playing?stop():start();
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('again').onclick=()=>{stop();S.playing=true;$('play').textContent='❚❚ Pausar';
 $('play').classList.add('on');one(S.i).then(()=>{if(S.playing)stop();});};
$('rate').oninput=()=>{$('ratev').textContent=(+$('rate').value).toFixed(2)+'×';
 au.playbackRate=parseFloat($('rate').value);save();};
['mode','reps','gap'].forEach(k=>$(k).onchange=save);
$('sec').onchange=()=>{renderList();save();};$('q').oninput=renderList;
$('hide').onchange=()=>{renderList();paint();save();};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;
 if(e.code==='Space'){e.preventDefault();S.playing?stop():start();}
 else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);
 else if(e.key.toLowerCase()==='r')$('again').click();});

DATA.secs.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;$('sec').appendChild(o);});
const st=load();if(st.r)$('rate').value=st.r;$('ratev').textContent=(+$('rate').value).toFixed(2)+'×';
if(st.m)$('mode').value=st.m;if(st.p)$('reps').value=st.p;if(st.g)$('gap').value=st.g;
if(st.h)$('hide').checked=st.h;if(typeof st.i==='number'&&rows[st.i])S.i=st.i;
renderList();paint();scan();
</script></body></html>
